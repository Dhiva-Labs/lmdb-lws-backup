name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            file_arch: x86-64
            elf_machine: Advanced Micro Devices X86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            file_arch: ARM aarch64
            elf_machine: AArch64
    steps:
      - uses: actions/checkout@v4

      - name: Assert the runner is ${{ matrix.arch }}
        run: |
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake curl ca-certificates

      # libsodium is built from the pinned tarball (scripts/fetch-libsodium.sh);
      # the cache is per CPU architecture, the script skips the build on a hit.
      - name: Cache static libsodium
        uses: actions/cache@v4
        with:
          path: third_party/local
          key: libsodium-${{ matrix.arch }}-${{ hashFiles('scripts/fetch-libsodium.sh', 'scripts/libsodium-*.sha256') }}

      - name: Build static libsodium
        run: ./scripts/fetch-libsodium.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test (unit + end-to-end integration)
        run: ctest --test-dir build --output-on-failure

      - name: Verify architecture and linking
        run: |
          .github/scripts/verify-binary.sh build/lmdb-lws-backup \
            third_party/local/lib/libsodium.a \
            "${{ matrix.file_arch }}" "${{ matrix.elf_machine }}"

      - name: Stage the release binary
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tool_version=$(sed -n 's/.*kToolVersion\[\] = "\(.*\)";/\1/p' src/version.h)
          cmake_version=$(sed -n 's/^project(lmdb-lws-backup VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version.h: $tool_version, CMakeLists.txt: $cmake_version"
          test "$tool_version" = "$cmake_version"
          if [ "$EVENT" = release ]; then
            test "${TAG#v}" = "$tool_version" || {
              echo "::error::release tag $TAG does not match the source version $tool_version"
              exit 1
            }
          fi
          mkdir dist
          cp build/lmdb-lws-backup "dist/lmdb-lws-backup-${tool_version}-linux-${{ matrix.arch }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: lmdb-lws-backup-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Combines both binaries with a SHA256SUMS file, so the packaging is
  # exercised on every run, not only when a release needs it.
  package:
    name: release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lmdb-lws-backup-linux-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          chmod +x lmdb-lws-backup-*
          sha256sum lmdb-lws-backup-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # Packages for distributions beyond Debian/Ubuntu, from the binary the
  # build job compiled and tested: .rpm (Fedora, RHEL, openSUSE) and
  # .pkg.tar.zst (Arch). Each is installed on its real distribution and runs
  # a backup, verify and restore cycle there (packaging/linux-distros/).
  # A command-line tool gets no AppImage or Flatpak.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lmdb-lws-backup-linux-${{ matrix.arch }}
          path: bin

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .rpm and Arch package
        run: |
          VERSION=$(sed -n 's/^project(lmdb-lws-backup VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          packaging/linux-distros/make-tree.sh "bin/lmdb-lws-backup-$VERSION-linux-${{ matrix.arch }}" "$RUNNER_TEMP/root"
          VERSION="$VERSION" packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO for lmdb-lws-backup-bin, rendered with
  # the checksums of this run's release binaries and proven with makepkg on
  # archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Render and check the PKGBUILD
        run: |
          VERSION=$(sed -n 's/^project(lmdb-lws-backup VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          VERSION="$VERSION" packaging/arch/aur.sh \
            "assets/lmdb-lws-backup-$VERSION-linux-x86_64" "assets/lmdb-lws-backup-$VERSION-linux-aarch64" dist

      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Attaches the .rpm, Arch packages and AUR recipe to a published release.
  # Runs on every event, so a missing file fails before a release needs it;
  # only the upload is gated. A name already on the release is skipped, never
  # replaced.
  release-distros:
    name: attach other-distro packages
    needs: [distros, aur]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: distros-*
          merge-multiple: true
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: assets

      - name: Check the files
        run: |
          v=$(sed -n 's/^project(lmdb-lws-backup VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          ls -l assets
          expected="
          lmdb-lws-backup-$v-1.x86_64.rpm
          lmdb-lws-backup-$v-1.aarch64.rpm
          lmdb-lws-backup-$v-1-x86_64.pkg.tar.zst
          lmdb-lws-backup-$v-1-aarch64.pkg.tar.zst
          lmdb-lws-backup-bin-$v-aur.tar.gz"
          for f in $expected; do
            [ -f "assets/$f" ] || { echo "::error::missing assets/$f"; exit 1; }
          done
          [ "$(ls assets | wc -l)" -eq 5 ]
          cd assets && sha256sum -- *

      - name: Upload to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in assets/*; do
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF -- "$name"; then
              echo "skip $name (already on the release)"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done

  # Runs when a release is published (releases are made by hand). Adds the
  # binaries that are missing from it and never replaces one that is there.
  release:
    name: attach to the release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload the missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/upload-release-assets.sh "$TAG" dist
