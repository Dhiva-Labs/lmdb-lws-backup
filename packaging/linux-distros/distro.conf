# Package metadata for the other-distribution packages (.rpm, Arch package,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh, in-container.sh and packaging/arch/aur.sh.

NAME=lmdb-lws-backup
GITHUB_REPO=Dhiva-Labs/lmdb-lws-backup
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Encrypted hot backups for LMDB environments such as monero-lws'
DESCRIPTION='Takes a compacted, read-only snapshot of a running LMDB environment, streams it through XChaCha20-Poly1305 encryption, verifies the encrypted file in RAM before promoting it and prunes old backups. Includes a profile for the monero-lws database and systemd units for a daily timer.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/lmdb-lws-backup
# The repository has no license file of its own yet. NOASSERTION is the SPDX
# value for "no license stated"; the vendored LMDB, toml++ and libsodium
# licenses are installed to /usr/share/licenses/lmdb-lws-backup/.
LICENSE=NOASSERTION
LICENSE_FILE=

# The binary links the C++ runtime, LMDB and libsodium statically: glibc is
# its only shared dependency (rpm derives it from the ELF file).
RPM_REQUIRES=()
ARCH_DEPENDS=(glibc)
ARCH_INDEPENDENT=0

# A command-line tool: no AppImage or Flatpak.
APPIMAGE=0

# Smoke test, run in each distribution container after installing the
# package: a real backup, verify, list and restore cycle (smoke.sh), which
# needs the LMDB command-line tools to make and read a small environment.
SMOKE_DEPS=(lmdb)
SMOKE_CMD='bash /linux-distros/smoke.sh'
